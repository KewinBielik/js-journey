<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 29 — From memory</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 520px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
            color: #1f2937;
        }
        h1 { margin-bottom: 0.25rem; }
        .hint { color: #6b7280; margin-top: 0; }
        form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            font: inherit;
            font-weight: 400;
            padding: 0.55rem 0.65rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }
        button[type="submit"] {
            padding: 0.6rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #6495ed;
            color: white;
            font-weight: 600;
        }
        #formError {
            color: #b91c1c;
            min-height: 1.25rem;
            margin: 0;
            font-size: 0.9rem;
        }
        #linkList {
            list-style: none;
            padding: 0;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            margin: 0.5rem 0;
            background: #f3f4f6;
            border-radius: 8px;
        }
        .link-item a {
            flex: 1;
            color: #6495ed;
            font-weight: 600;
            text-decoration: none;
        }
        .link-item a:hover { text-decoration: underline; }
        .btn-delete {
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            border: 1px solid #fca5a5;
            border-radius: 4px;
            background: #fee2e2;
        }
    </style>
</head>
<body>
    <h1>Link saver</h1>
    <p class="hint">Lesson 29 — build from memory. Spec is in LESSON.md. HTML is ready; JS is yours.</p>

    <form id="linkForm">
        <label>
            Title
            <input type="text" name="title" placeholder="e.g. MDN fetch">
        </label>
        <label>
            URL
            <input type="url" name="url" placeholder="https://…">
        </label>
        <p id="formError"></p>
        <button type="submit">Save link</button>
    </form>

    <ul id="linkList"></ul>

    <!-- Use a normal script OR type="module" — your choice. -->
    <script src="script.js"></script>
</body>
</html>
